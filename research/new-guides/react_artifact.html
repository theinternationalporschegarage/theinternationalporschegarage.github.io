        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        .font-serif-lux { font-family: 'Cormorant Garamond', serif; }
        .font-sans-lux { font-family: 'Inter', sans-serif; }

        @keyframes circle-draw {
          0% { stroke-dashoffset: 1000; opacity: 0; }
          20% { opacity: 1; }
          100% { stroke-dashoffset: 0; opacity: 1; }
        }
        @keyframes car-drive-in {
          0% { transform: translateX(-180px) scale(0.9); opacity: 0; filter: blur(8px); }
          30% { opacity: 1; filter: blur(4px); }
          70% { transform: translateX(12px) scale(1.02); filter: blur(0.5px); }
          85% { transform: translateX(-4px) scale(1); filter: blur(0); }
          100% { transform: translateX(0) scale(1); opacity: 1; filter: blur(0); }
        }
        @keyframes text-rise {
          0% { opacity: 0; transform: translateY(18px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer-sweep {
          0% { transform: translateX(-150%) skewX(-18deg); opacity: 0; }
          15% { opacity: 0.9; }
          50% { opacity: 0.6; }
          100% { transform: translateX(250%) skewX(-18deg); opacity: 0; }
        }
        @keyframes dust-float {
          0% { transform: translateY(0) translateX(0) scale(0); opacity: 0; }
          10% { opacity: 0.8; transform: scale(1); }
          80% { opacity: 0.4; }
          100% { transform: translateY(-160px) translateX(20px) scale(0.3); opacity: 0; }
        }
        @keyframes cta-up {
          0% { opacity: 0; transform: translateY(40px); }
          60% { opacity: 1; transform: translateY(-6px); }
          80% { transform: translateY(3px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes glow-pulse {
          0%, 100% { opacity: 0.35; transform: scale(1); }
          50% { opacity: 0.55; transform: scale(1.08); }
        }
        @keyframes banner-in {
          0% { opacity: 0; transform: translateY(-8px) scale(0.9); }
          100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes laurel-in {
          0% { opacity: 0; transform: scale(0.85) translateY(6px); }
          100% { opacity: 1; transform: scale(1) translateY(0); }
        }
