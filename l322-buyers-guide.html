t or damp = £900 job.","VANOS rattle at 2,500rpm + lumpy idle. M62TU VANOS seals gone = loss of low-end torque.","PCV system: Remove oil cap at idle - excessive suction or smoke = CCV failed, will blow rocker gaskets."],redFlags:["Mayo under oil cap + coolant loss = valley pan leak pressurising crankcase.","Overheating history. M62 does NOT tolerate it. Head gasket or slipped liner if pegged.","Fresh coolant with no history of water pump/thermostat - hiding something."],proTip:"Pop the bonnet, engine cold. Remove acoustic cover. Shine light down V - if it's swimming in dried coolant, walk or budget £1,200. Check expansion tank is not brown and cracked. BMW tank fails at 70k like clockwork.",cost:"£1,800 - £3,500 for chain guides, valley pan, water pump, VANOS rebuild at a specialist.",checklist:["Cold start rattle 0-3 seconds? (Chain guides)","Valley pan dry? Check with torch","Oil cap test - PCV vacuum okay?","No coolant smell, tank not cracked/brown","No VANOS diesel rattle at 2.5k rpm"]},{day:3,theme:"TRANSMISSION & DRIVETRAIN",hook:"The ZF 5HP24 is strong until 100k. After that, torque converter decides your wallet's fate.",watchFor:["ZF 5HP24 shudder: 30-50mph light throttle, revs flutter 200rpm. Converter clutch is gone.","Harsh 2-1 downshift when hot = valve body wear. £400 rebuild kit + labour.","Transfer case chain slap on tight turn + whine in low range. NV225 needs fluid every 40k, nobody does it.","Front diff whine 50-70mph + prop shaft vibration at 60mph. Centre bearing £180, diff £600 used."],redFlags:["Gearbox fault message + limp mode even once. Will strand you. EDC needs diagnostics.","Black / burnt ATF on dipstick (if fitted) or never changed. ZF wants fresh Lifeguard 5 every 60k.","Clunk from front on take-off = diff mounts + drive shaft spline wear. Expensive to diagnose."],proTip:"Drive it stone cold. Let it idle 30 sec, then D to R - should engage in <1.5 sec, no thud. On test drive, hold 40mph in 5th, light throttle. If revs hunt, budget £1,500 for converter. Check transfer case fluid - if black, it's never been done.",cost:"£1,200 - £2,800 torque converter, £2,500 - £4,000 full ZF rebuild, £900 transfer case.",checklist:["Cold D/R engagement smooth <1.5s","No shudder 30-50mph light throttle","No whine in transfer low range","Prop shaft centre bearing not vibrating","No front diff clunk on takeoff"]},{day:4,theme:"AIR SUSPENSION & CHASSIS",hook:`"Air Suspension Inactive" is not a feature. It's a £600 starting bill.`,watchFor:["EAS compressor: Should run <60 sec to lift. If runs constantly + hot = tired Wabco + leaks.","Air bags: 2004 originals are 20 years old. Look for micro-cracks, soapy water test. Dunlop rear bags fail first.","Height sensors: Car sits wonky after 10 min parked. Sensors corroded, arms seized = £90 each x4.","Subframe & front inner wings: Jack up, check front subframe mounts and rear subframe for serious rust, especially UK salt cars."],redFlags:["Car on bump stops in morning. Bags leaking overnight = compressor burnout imminent.","Air suspension inactive message cleared with 'just needs reset'. It's hiding leaks.","Aftermarket coil conversion on a 2004 - someone gave up. Ruins value + ride."],proTip:"Bring a tape measure. Measure arch to centre cap on all 4 corners in standard height. Should be within 10mm side to side. Then switch to off-road height - should lift in 45 sec evenly. If one corner lazy, bag or valve block. Check compressor in spare wheel well - if it's Hitachi AMK, it's been replaced, good sign.",cost:"£450 compressor, £320/pair bags, £180 valve block rebuild, £1,200 if subframe rust is bad.",checklist:["Lifts to off-road height in <60s evenly","Sits level overnight (measure)","No hissing at bags after shutdown","Compressor not screaming constantly","No subframe rust at mounting points"]},{day:5,theme:"ELECTRONICS & ELECTRICS",hook:"BMW electrics in a British body. One sunroof drain blocks and your BECM swims.",watchFor:["Battery drain: L322 needs 100Ah AGM minimum. If seller jump starts it, final stage resistor + LCM drain is likely.","LCM / Light Control: Indicators flash fast, headlights flicker, dash pixels dead. LCM II prone to dry joints.","Steering column: Electric adjust fails, clunks. Column ECU £300, motors £150 each. Test all directions.","Sunroof drains: Pour water in sunroof tray - should drain behind front wheels + rear arches. If water in A-pillar, BECM in passenger footwell is next."],redFlags:["Water in passenger footwell or boot cubbies. BECM, Bluetooth module, DSP amp sit in puddles.","Sat nav MK3 stuck on logo, MK4 DVD drive grinding. Battery drain culprit #1.","All door locks cycling by themselves. Door latch microswitches + BECM getting wet."],proTip:"Pull up passenger footwell carpet edge. Feel underlay - if damp or musty, sunroof drains blocked for months. That's a BECM killer. Check boot left cubby - amp + nav drive should be bone dry. Bring a 12v voltmeter - battery should be 12.6v+ after 12h parked.",cost:"£250 final stage resistor, £600 BECM repair/replacement, £400 steering column ECU, £1k+ if loom corroded from leaks.",checklist:["Passenger footwell & boot cubbies bone dry","Battery 12.6v after overnight sit","Steering column adjusts all ways silently","Sat nav loads, no battery drain overnight","No door lock cycling or LCM flicker"]},{day:6,theme:"BODY, RUST & WATER LEAKS",hook:"Aluminium body hides steel nightmares. Rust lives where you don't look.",watchFor:["Upper + lower tailgate: Lower steel frame rots inside, upper handle area bubbles. £400+ paint, £700 new lower.","Front inner wings: Open bonnet, look at top mount area + where wing meets bulkhead. Bubbling = water trap.","Rear wheel arches: Behind plastic liners, especially leading edge. Stone chip to rust highway.","Windscreen scuttle: Pollen filter housing fills, drains block, water into ECU box. Lift scuttle panel - leaves = neglect."],redFlags:["Fresh underseal everywhere underneath - hiding rot. Should be factory wax, not black tar.","Boot floor damp under spare wheel. Tailgate seal + rear lights + air vents leak trifecta.","Mismatched paint on aluminium panels - previous accident repair badly done, galvanic corrosion risk."],proTip:"Run finger under tailgate lower edge inside - rough = rust starting inside out. Check door bottoms inside lip - L322 doors hold water if drains blocked. Windscreen surround - if replaced with non-OEM sealant, leaks into BECM. Always ask when screen last done.",cost:"£600 tailgate lower refurb, £900 arch repair both sides, £2k+ if inner wings need welding.",checklist:["Tailgate upper & lower edge smooth, no bubbles","Front inner wings dry, no bubbling at mounts","Rear arches clean behind liners","Scuttle drains clear, pollen filter housing dry","Boot floor under spare bone dry"]},{day:7,theme:"THE FINAL TEST DRIVE & NEGOTIATION",hook:"Cold start tells you everything. Warm engine hides sins.",watchFor:["Cold start protocol: Arrive early, touch exhaust - should be stone cold. Listen for chain rattle, watch exhaust - blue = valve seals.","Diagnostics: Must see AllComms, IIDTool or Autologic live data - not just 'no lights'. Check gearbox adaptations, EAS pressures, misfire counts.","Negotiation maths: Every fault has a price. Chain rattle = -£2k, suspension inactive = -£600, battery drain = -£400, rust = -£800.","Paperwork: V5, MOT history print, service stamps with mileage matching invoices, 2 keys (new key £300 + EWS sync)."],redFlags:["Seller insists engine is warm when you arrive. Classic hide-the-rattle.","Refuses diagnostics or 'my mate cleared codes yesterday'. Codes tell story.","No proof of coolant/ATF changes. 2004 needs both every 50k, not 'lifetime'."],proTip:"Our garage formula: Offer = Asking - (Known Faults x 1.3). The 0.3 is your hassle tax. Then immediate service: Oil + filter, coolant flush + expansion tank, gearbox service with Lifeguard 5, transfer + diffs oil, EAS compressor filter. Budget £1,200 baseline and you won't be stranded. Best £1,200 you'll spend.",cost:"Baseline service £1,200, full diagnostic £120, 2nd key £300. Bargain £1k-£2k off if you know faults.",checklist:["Cold start done - stone cold, no rattle, no smoke","Live diagnostics checked - no hidden faults","Test drive 15+ min including motorway 70mph","All paperwork, 2 keys, V5 present","Offer calculated with fault prices + baseline service"]}];function du(){let[e,t]=yt.useState(0),[n,r]=yt.useState({}),[l,o]=yt.useState(!1),i=yt.useRef(null);yt.useEffect(()=>{if(i.current){let p=i.current,v=p.clientWidth;p.scrollTo({left:e*v,behavior:"smooth"})}},[e]);let u=()=>{if(!i.current)return;let p=i.current.scrollLeft,v=i.current.clientWidth,w=Math.round(p/v);if(w!==e&&w>=0&&w<Ze.length)t(w)},a=(p,v)=>{let w=`${p}-${v}`;r((S)=>({...S,[w]:!S[w]}))},c=Object.values(n).filter(Boolean).length,m=Ze.reduce((p,v)=>p+v.checklist.length,0),h=Ze.map((p)=>`DAY ${String(p.day).padStart(2,"0")} - ${p.theme}
